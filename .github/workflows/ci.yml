# Verify-only CI. It deliberately does NOT deploy.
# Deployments happen through Cloudflare Workers Builds (`npx cf deploy --prebuilt`).
# The old deploy.yml was removed on 2026-10-15 after its "Deploy Worker" step failed
# on every push; do not re-add API tokens to GitHub Actions.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sg16finance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for the build-time commit SHA in /api/version

      - uses: actions/setup-node@v4
        with:
          # cf@1.0.0-beta.25 requires ^22.23.0 || ^24.22.0 || ^26.12.0
          node-version: "22.23.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (app + cron Worker)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build for Cloudflare (vinext)
        run: npm run build:vinext
